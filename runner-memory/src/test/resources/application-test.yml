kestra:
  repository:
    type: memory
  queue:
    type: memory
  storage:
    type: local
    local:
      base-path: /tmp/unittest
  jdbc:
    queues:
      min-poll-interval: 10ms
      max-poll-interval: 200ms
      poll-switch-interval: 4s
  server:
    liveness:
      enabled: false
    termination-grace-period: 5s
# Disable Micronaut embedded gRPC server and health check
grpc:
  server:
    enabled: false
    health:
      enabled: false