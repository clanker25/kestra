kestra:
  queue:
    type: memory
  repository:
    type: memory
  jdbc:
    queues:
      min-poll-interval: 20ms
      max-poll-interval: 100ms
      poll-switch-interval: 5s
  server:
    liveness:
      enabled: true
    termination-grace-period: 5s
# Disable Micronaut embedded gRPC server and health check
grpc:
  server:
    enabled: false
    health:
      enabled: false