id: task-allow-warning-runnable
namespace: io.kestra.tests

tasks:
  - id: fail
    type: io.kestra.plugin.core.execution.Fail
    allowFailure: false
    allowWarning: true
    retry:
      type: constant
      interval: PT0.100S
      maxAttempts: 2
  - id: log
    type: io.kestra.plugin.core.log.Log
    message: I'm allowed